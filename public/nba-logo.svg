<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="100%" height="100%">
  <rect width="320" height="180" rx="16" fill="#0b162a" />
  <!-- NBA Rounded Pill Badge -->
  <g transform="translate(115, 20)">
    <clipPath id="nbaPill">
      <rect x="0" y="0" width="54" height="120" rx="14" />
    </clipPath>
    <g clip-path="url(#nbaPill)">
      <!-- Left Blue -->
      <rect x="0" y="0" width="27" height="120" fill="#17408B" />
      <!-- Right Red -->
      <rect x="27" y="0" width="27" height="120" fill="#C9082A" />
      <!-- Silhouetted Dribbler -->
      <path d="M 28 18 C 24 18 22 22 24 26 C 26 29 29 27 28 18 Z M 27 34 C 23 37 20 44 20 54 L 20 72 L 25 72 L 25 88 L 18 108 L 26 108 L 30 94 L 35 108 L 43 108 L 36 84 L 38 68 C 42 66 45 60 44 52 C 43 45 37 42 32 40 L 29 34 Z M 16 75 C 13 75 11 78 11 81 C 11 84 13 87 16 87 C 19 87 21 84 21 81 C 21 78 19 75 16 75 Z" fill="#ffffff" />
    </g>
  </g>
  <!-- Text Label -->
  <text x="210" y="75" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="34" text-anchor="middle" letter-spacing="1">NBA</text>
  <rect x="180" y="88" width="60" height="26" rx="6" fill="#17408B" stroke="#ffffff" stroke-width="1.5" />
  <text x="210" y="106" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="16" text-anchor="middle" letter-spacing="2">TV</text>
  <text x="160" y="162" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="11" text-anchor="middle" letter-spacing="3">24/7 LIVE BASKETBALL</text>
</svg>
